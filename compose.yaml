services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yunakquiz
      POSTGRES_PASSWORD: yunakquiz
      POSTGRES_DB: yunakquiz
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yunakquiz -d yunakquiz']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
