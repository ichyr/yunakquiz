services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yunakquiz
      POSTGRES_PASSWORD: yunakquiz
      POSTGRES_DB: yunakquiz
      # Ukrainian alphabetical order (а б в г ґ д е є ж з и і ї й …) for every ORDER BY, whatever the
      # image's libc. Same flags as CI; on AWS create the database WITH LOCALE_PROVIDER icu ICU_LOCALE 'uk-UA'.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=uk-UA
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yunakquiz -d yunakquiz']
      interval: 2s
      timeout: 5s
      retries: 15

  # Local SES. Pinned to a tag that runs without an auth token (see docs/localstack-licence.md).
  localstack:
    image: localstack/localstack:4.12
    environment:
      SERVICES: ses
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:4566/_localstack/init/ready | grep -q "\"completed\": true"',
        ]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
