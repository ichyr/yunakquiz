name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:stories
      - run: pnpm build:web
      - run: pnpm build-storybook

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yunakquiz
          POSTGRES_PASSWORD: yunakquiz
          POSTGRES_DB: yunakquiz_test
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=uk-UA
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yunakquiz -d yunakquiz_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      localstack:
        image: localstack/localstack:4.12
        env:
          SERVICES: ses
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://yunakquiz:yunakquiz@localhost:5432/yunakquiz_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # compose.yaml does this through docker/localstack-init, which a service container cannot mount.
      - name: Verify the SES sender in LocalStack
        run: >-
          curl -sf -X POST http://localhost:4566/
          -H "Authorization: AWS4-HMAC-SHA256 Credential=test/20260101/us-east-1/ses/aws4_request"
          -d "Action=VerifyEmailIdentity&Version=2010-12-01&EmailAddress=noreply@yunakquiz.test"
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yunakquiz
          POSTGRES_PASSWORD: yunakquiz
          POSTGRES_DB: yunakquiz
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=uk-UA
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yunakquiz -d yunakquiz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      localstack:
        image: localstack/localstack:4.12
        env:
          SERVICES: ses
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://yunakquiz:yunakquiz@localhost:5432/yunakquiz
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yunakquiz/web exec playwright install --with-deps chromium
      # compose.yaml does this through docker/localstack-init, which a service container cannot mount.
      - name: Verify the SES sender in LocalStack
        run: >-
          curl -sf -X POST http://localhost:4566/
          -H "Authorization: AWS4-HMAC-SHA256 Credential=test/20260101/us-east-1/ses/aws4_request"
          -d "Action=VerifyEmailIdentity&Version=2010-12-01&EmailAddress=noreply@yunakquiz.test"
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
