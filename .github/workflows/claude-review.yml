# Advisory Claude review (issue #38). Not a required check: it never blocks merging.
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (made with `claude setup-token`).
# The `@claude review` comment trigger only works once this file is on main,
# because GitHub runs issue_comment workflows from the default branch.
name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

# Least access. `issues: read` is needed to read the linked issue in this private repo.
permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Claude review
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        # Advisory: a failed review never fails the check.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: 'false'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are giving an advisory code review of this pull request. Review it on two axes.

            1. Standards: does the change follow this repo's documented standards?
               Read CLAUDE.md, apps/web/CLAUDE.md, apps/api/CLAUDE.md, every ADR in docs/adr/,
               and GLOSSARY.md (use its terms; flag the listed synonyms).
            2. Spec: does the change do what the linked issue asks?
               Find the issue with `gh pr view <PR NUMBER> --json title,body,closingIssuesReferences`
               and read it with `gh issue view <number>`. Check each acceptance criterion.
               If no issue is linked, say so and skip this axis.

            Get the change with `gh pr diff <PR NUMBER>`, or `git diff origin/<base branch>...HEAD`
            (base branch from `gh pr view <PR NUMBER> --json baseRefName`). Read files for context.

            Output:
            - Inline comments on specific lines via mcp__github_inline_comment__create_inline_comment,
              one per concrete finding, saying which axis it belongs to.
            - Exactly one summary comment via `gh pr comment <PR NUMBER> --body "..."` with two
              sections, "Standards" and "Spec", each listing findings or saying none were found.
            Be concise. Do not repeat inline findings at length in the summary.
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
